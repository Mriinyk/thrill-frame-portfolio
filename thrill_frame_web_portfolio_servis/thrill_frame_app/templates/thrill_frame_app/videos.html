{% extends 'thrill_frame_app/base.html' %}
{% load static %}

{% block content %}
<!-- Підключення окремих стилів -->
<link rel="stylesheet" href="{% static 'thrill_frame_app/css/style.css' %}">

<!-- Кнопка додавання відео для суперюзера -->
{% if user.is_superuser %}
    <a href="{% url 'thrill_frame_app:add_video' %}" class="add-video-btn" title="Додати нове відео">
        <i class="bi bi-plus-lg"></i>
    </a>
{% endif %}

<!-- Контейнер з відступом 9rem від навбару -->
<div class="container videos-page-wrapper">
    <!-- Заголовок вилучено за вимогою -->

    <div class="video-grid-container">
        <div class="row g-4 justify-content-center">
            {% for video in videos %}
                <div class="col-12 col-md-10 col-lg-8">
                    <div class="release-card-large" 
                         data-video-id="{{ video.youtube_id }}" 
                         data-video-title="{{ video.title }}">
                        
                        <div class="card-thumbnail-wrapper">
                            {% if video.thumbnail_url %}
                                <img src="{{ video.thumbnail_url }}" alt="{{ video.title }}" class="card-thumbnail" loading="lazy">
                            {% else %}
                                <div class="card-thumbnail-placeholder"></div>
                            {% endif %}
                            
                            <div class="play-overlay">
                                <i class="bi bi-play-fill"></i>
                            </div>
                        </div>

                        <div class="mt-3 text-center">
                            <div class="release-title fw-bold text-white fs-4">{{ video.title }}</div>
                        </div>
                    </div>
                </div>
            {% empty %}
                <div class="col-12 text-center text-muted py-5">
                    <p class="fs-5">Відео поки немає.</p>
                </div>
            {% endfor %}
        </div>
    </div>
</div>

<!-- Модальне вікно для відтворення відео -->
<div class="modal fade custom-video-modal" id="videoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-0 shadow-lg" style="border-radius: 16px; overflow: hidden;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fs-6 text-truncate" id="videoModalTitle"></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-2 p-md-3">
                <div class="ratio ratio-16x9">
                    <iframe id="youtubePlayer" 
                            src="" 
                            title="YouTube Video" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Підключення окремого скрипта -->
<script src="{% static 'thrill_frame_app/js/video-slider.js' %}"></script>
{% endblock %}
